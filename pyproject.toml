[build-system]
requires = ["setuptools", "wheel","setuptools_scm","setuptools_scm[toml]"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme="no-local-version"
write_to = "src/hardtrimtoolkit/version.py"
git_describe_command = "git describe --dirty --tags --long --match [1234567890].*"

[tool.setuptools.dynamic]
version = {attr = "hardtrimtoolkit.version.__version__"}
readme = {file = ["README.md"], content-type = "text/md"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/integration"]
addopts = "-ra"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s %(levelname)s %(name)s: %(message)s"

[project]
name = "hardtrimtoolkit"
dynamic = ["version", "readme"]
license = "GPL-3.0-or-later"
authors = [
  { name="mmterpstra", email="mmterpstra@users.noreply.github.com" },
]
description = "Small toolkit to hardtrim bam reads based on the (markIlluminaAdapters) trimming tag."
requires-python = ">=3.6"
dependencies = [
  "pysam>=0.21.0"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]


[project.urls]
Homepage = "https://github.com/mmterpstra/hardtrimtoolkit"
Issues = "https://github.com/mmterpstra/hardtrimtoolkit/issues"
[project.scripts]
hardtrimadapters = "hardtrimtoolkit.hardtrimtoolkit:hardtrim_adapters_cli"
reverthardtrimadapters = "hardtrimtoolkit.hardtrimtoolkit:revert_hardtrim_adapters_cli"

